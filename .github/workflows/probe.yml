name: probe
# Vorübergehend: ermittelt Download-Adressen offener Feldblock-Daten (wird danach entfernt)
on:
  push:
    paths: ['.github/probe/**', '.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for u in \
            "https://data.source.coop/fiboa/de-nds/README.md" \
            "https://data.source.coop/fiboa/de-sh/README.md" \
            "https://data.source.coop/fiboa/de-mv/README.md" \
            "https://data.source.coop/fiboa/de-st/README.md" \
            "https://data.source.coop/fiboa/de-bb/README.md" ; do
            echo "=================== $u"; curl -sSL -m 30 "$u" | head -c 6000; echo
          done
          for p in fiboa/de-nds/ fiboa/de-sh/ fiboa/de-st/ fiboa/de-bb/ fiboa/de-mv/ ftw/harmonized-field-data/de_sh/; do
            echo "=================== LIST $p"
            curl -sSL -m 30 "https://data.source.coop/?list-type=2&prefix=$p" | head -c 4000; echo
            curl -sSL -m 30 "https://data.source.coop/${p%%/*}?list-type=2&prefix=${p#*/}" | head -c 4000; echo
          done
