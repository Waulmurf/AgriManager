name: ci

# Bei jedem Stand: Unit-Tests (Vitest, Rust) und Oberflächentests (Playwright,
# Chromium ≙ WebView2) unter Windows sowie Builds für Windows und macOS.
# Die fertige Windows-App startet im Selbsttest-Modus und meldet Leistung und
# Darstellung aus dem echten WebView2.
on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  unit:
    name: Unit-Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Zielplattformen sind Windows und macOS; macOS vorerst ohne Tests (nur Build)
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # echte Kartendaten: Plausibilität und Rechenzeit des Kerns je Betriebssystem
      - name: Kartendaten laden
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/map
          key: map-${{ hashFiles('data/map-data.json') }}
      - run: npm run map-data
      # gleiche Referenz-Hashes auf allen Systemen = plattformunabhängiger Determinismus
      - run: npx vitest run --silent=false
      - name: Rust-Tests (Range-Protokoll)
        working-directory: src-tauri
        run: cargo test -p range_proto

  e2e:
    name: Oberfläche (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            projects: chromium
            # Browser-Worker auf diesem Runner ohne GPU stark gebremst: nur Funktion, keine Raten
            strictTiming: '0'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Kartendaten laden
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/map
          key: map-${{ hashFiles('data/map-data.json') }}
      - run: npm run map-data
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Playwright
        run: npx playwright test
        env:
          CI: '1'
          PW_PROJECTS: ${{ matrix.projects }}
          # CI-Runner haben keine GPU: WebGL läuft in Software und belegt die CPU,
          # die sich der Simulations-Worker teilt. Hier nur Untergrenzen gegen grobe
          # Fehler; die Zielwerte (≥ 90 Schritte/s, ≥ 30 fps) gelten für echte Rechner.
          PERF_MIN_FPS: '3'
          E2E_MIN_SPS: '10'
          E2E_STRICT_TIMING: ${{ matrix.strictTiming || '1' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-${{ matrix.os }}
          path: |
            playwright-report
            test-results
          retention-days: 14

  build:
    name: App-Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ''
          # macOS: nur Build der Universal-DMG (hält die Mac-Fähigkeit im Blick), vorerst ohne Tests.
          # Intel-Runner, weil arm64-Runner oft ausgelastet sind.
          - name: macOS Universal
            os: macos-15-intel
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Kartendaten laden
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/map
          key: map-${{ hashFiles('data/map-data.json') }}
      - run: npm run map-data
      - name: Tauri-Build
        run: npx tauri build ${{ matrix.args }}

      - name: Selbsttest der fertigen App (Windows, WebView2)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release -Filter *.exe -File | Select-Object -First 1
          Write-Output "Starte $($exe.FullName)"
          Get-ChildItem src-tauri/target/release -Directory | Select-Object Name
          $env:LOHNBETRIEB_SELFTEST = '1'
          $env:LOHNBETRIEB_SELFTEST_SECONDS = '20'
          $env:LOHNBETRIEB_SELFTEST_MIN_FPS = '3'
          $env:LOHNBETRIEB_SELFTEST_MIN_SPS = '10'
          $env:LOHNBETRIEB_SELFTEST_OUT = "$PWD/selftest-windows.json"
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 25
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD/selftest-windows.png")
          if (-not $p.WaitForExit(150000)) { $p.Kill() }
          if (Test-Path selftest-windows.json) { Get-Content selftest-windows.json } else { Write-Output 'kein Ergebnis' }
          if (-not (Select-String -Path selftest-windows.json -Pattern '"ok":true' -Quiet)) { exit 1 }

      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: selbsttest-${{ matrix.name }}
          path: |
            selftest-*.json
            selftest-*.png
            app-*.log
            build-info.txt
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 14
